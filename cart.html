<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart - Dharshu Shopping</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛍️ Dharshu Shopping</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="women.html">Women</a>
        <a href="boys.html">Boys</a>
        <a href="kids.html">Kids</a>
        <a href="electronics.html">Electronics</a>
        <a href="cart.html">🛒 Cart</a>
    </nav>
</header>


<section class="cart-page">

    <h2>🛒 My Shopping Cart</h2>

    <div id="cart-list"></div>

    <div class="cart-summary">

        <h2>Price Details</h2>

        <div class="summary-row">
            <span>Original Price</span>
            <span>₹<span id="original-total">0</span></span>
        </div>

        <div class="summary-row discount-row">
            <span>Total Discount</span>
            <span>- ₹<span id="discount-total">0</span></span>
        </div>

        <hr>

        <div class="summary-row total-row">
            <strong>Total Amount</strong>
            <strong>₹<span id="total-price">0</span></strong>
        </div>

        <button class="place-order" onclick="placeOrder()">
            Place Order
        </button>

    </div>

</section>


<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartList = document.getElementById("cart-list");
const originalTotal = document.getElementById("original-total");
const discountTotal = document.getElementById("discount-total");
const totalPrice = document.getElementById("total-price");


function displayCart() {

    cartList.innerHTML = "";

    if (cart.length === 0) {

        cartList.innerHTML = `
            <div class="empty-cart">
                <h2>🛒 Your Cart is Empty</h2>
                <p>Add some products to your cart.</p>

                <a href="index.html">
                    Continue Shopping
                </a>
            </div>
        `;

        originalTotal.innerText = "0";
        discountTotal.innerText = "0";
        totalPrice.innerText = "0";

        return;
    }


    let originalAmount = 0;
    let sellingAmount = 0;


    cart.forEach((product, index) => {

        // Support old cart items
        const original = product.originalPrice || product.price;
        const quantity = product.quantity || 1;

        const productOriginalTotal = original * quantity;
        const productSellingTotal = product.price * quantity;

        const discount =
            Math.round(((original - product.price) / original) * 100);


        originalAmount += productOriginalTotal;
        sellingAmount += productSellingTotal;


        const item = document.createElement("div");

        item.className = "cart-item";


        item.innerHTML = `

            <div class="cart-product-info">

                <h3>${product.name}</h3>

                <div class="cart-price">

                    <del>₹${original}</del>

                    <strong>₹${product.price}</strong>

                    <span>${discount}% OFF</span>

                </div>

                <p class="item-total">
                    Item Total: ₹${productSellingTotal}
                </p>

            </div>


            <div class="quantity-box">

                <button onclick="decreaseQuantity(${index})">
                    −
                </button>

                <span>${quantity}</span>

                <button onclick="increaseQuantity(${index})">
                    +
                </button>

            </div>


            <button
                class="remove-btn"
                onclick="removeProduct(${index})">

                Remove

            </button>

        `;


        cartList.appendChild(item);

    });


    const totalDiscount = originalAmount - sellingAmount;


    originalTotal.innerText = originalAmount;
    discountTotal.innerText = totalDiscount;
    totalPrice.innerText = sellingAmount;

}


// Increase quantity
function increaseQuantity(index) {

    if (!cart[index].quantity) {
        cart[index].quantity = 1;
    }

    cart[index].quantity++;

    saveCart();

}


// Decrease quantity
function decreaseQuantity(index) {

    if (!cart[index].quantity) {
        cart[index].quantity = 1;
    }

    if (cart[index].quantity > 1) {

        cart[index].quantity--;

    } else {

        cart.splice(index, 1);

    }

    saveCart();

}


// Remove product
function removeProduct(index) {

    cart.splice(index, 1);

    saveCart();

}


// Save cart
function saveCart() {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    displayCart();

}


// Place order
function placeOrder() {

    if (cart.length === 0) {

        alert("Your cart is empty!");

        return;
    }


    alert(
        "🎉 Order placed successfully!\n\nThank you for shopping with Divya Shopping."
    );


    localStorage.removeItem("cart");

    cart = [];

    displayCart();

}


displayCart();

</script>

</body>
</html>
